<!doctype html>
<!-- ═══════════════════════════════════════════════════════════════════════════════════
     TIDEL — meld deg av ventelista.   https://tidel.no/avmeld/#<kode>

     M6 (16. okt 2026): lenka nederst i hver e-post fra ventelista (bekreftelsen og «Tidel er
     åpen») går hit, med avmeldingskoden etter #. Alt etter # sendes ALDRI i HTTP-forespørselen:
     GitHub Pages ser «GET /avmeld/», og koden står aldri i en serverlogg eller i en Referer.

     HVORFOR EN SIDE MED KNAPP: et e-postprogram som sjekker lenker (bedriftsfiltre, «trygge
     lenker»), åpner HVER lenke i e-posten for å se om den er farlig. Før M6 meldte lenka av med
     én GET, så et slikt program meldte folk av uten at de visste det. Nå gjør sida ingenting når
     den åpnes. Først når en person trykker på knappen, går ETT POST til Edge-funksjonen
     venteliste (?avmeld=<kode>, uten kropp og uten egne hoder — ingen nøkkel trengs, koden er
     nøkkelen). Svaret er et ord: avmeldt eller ugyldig.

     Ingen telling (maaling.js) og ingen skript utenfra: sida bærer en kode som gjelder én
     adresse. Koden vises aldri; den brukes bare når den har formen 64 tegn 0-9a-f. Tekst settes
     KUN med textContent, aldri innerHTML.

     Sida er skrevet på engelsk; norsk legges over med textContent når nettleseren er norsk
     (nb/nn/no), samme grep som /v/ og /r/. Målt i tests/web.html seksjon 15.
     ═══════════════════════════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unsubscribe — Tidel</title>
<meta name="description" content="Unsubscribe from email from Tidel.">
<!-- noindex: sida har bare innhold for den som har en lenke fra en e-post. -->
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08080A">
<link rel="icon" href="/assets/brand/web/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tidel.css?v=2611171133">
<style>
  /* samme spalte og byggeklosser som /v/ og /r/: kicker, stor overskrift, rød strek, meldingsboks */
  .rWrap{max-width:860px;margin:0 auto;padding:44px 24px 80px}
  .rKick{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--acc);margin:0}
  .rWho{font-family:var(--disp);font-weight:700;font-size:clamp(28px,6vw,46px);
    letter-spacing:.03em;text-transform:uppercase;margin:14px 0 0;line-height:1.05;
    overflow-wrap:anywhere;word-break:break-word}
  .rRule{height:3px;background:var(--acc);width:120px;margin:26px 0 0}
  .rNote{color:#D2D2D8;margin:30px 0 0;max-width:62ch}
  .rCta{display:flex;gap:14px;flex-wrap:wrap;margin:28px 0 0}
  /* min-height 44: trykkflaten skal nås med hansker */
  .rCta .btn{min-height:44px}
  .btn[disabled]{opacity:.6;cursor:default}
  .aStatus{color:#D2D2D8;margin:14px 0 0;min-height:1.4em;max-width:62ch}
  .rMsg{border-left:3px solid var(--line2);background:var(--bg2);padding:18px 22px;
    margin:30px 0 0;color:#D2D2D8}
  .rMsg.bad{border-left-color:var(--acc)}
  .hid{display:none}
</style>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/"><span class="wmSet">TID<svg class="wm" viewBox="0 0 52 70" aria-hidden="true"><rect width="52" height="16"/><rect class="m" y="27" width="52" height="16"/><rect y="54" width="52" height="16"/></svg>L</span><small>MX Performance Tracker</small></a>
  <div class="links">
    <a href="/support/" data-t="navHjelp">Support</a>
    <a href="/site-privacy/" data-t="navPersonvern">Privacy</a>
    <a href="/contact/" data-t="navKontakt">Contact</a>
  </div>
</nav>

<main class="rWrap">

  <!-- ── med en kode: knappen ──────────────────────────────────────────────── -->
  <div id="aVis" class="hid">
    <p class="rKick" data-t="kick">Waiting list</p>
    <h1 class="rWho" data-t="tittel">Unsubscribe</h1>
    <div class="rRule"></div>
    <p class="rNote" data-t="note">Press the button, and Tidel sends you no more email.</p>
    <div class="rCta"><button class="btn primary" type="button" id="aKnapp" data-t="knapp">Unsubscribe me</button></div>
    <p class="aStatus" id="aStatus" role="status" aria-live="polite"></p>
  </div>

  <!-- ── svaret, eller en lenke uten kode ───────────────────────────────────── -->
  <div id="aMsg" class="hid">
    <p class="rKick" data-t="kick">Waiting list</p>
    <h1 class="rWho" id="mTitle"></h1>
    <div class="rRule"></div>
    <div class="rMsg" id="mBox"><p id="mText"></p></div>
    <div class="rCta"><a class="btn" href="/" data-t="hjem">Go to tidel.no</a></div>
  </div>

  <noscript>
    <p class="rKick">Tidel</p>
    <h1 class="rWho">Unsubscribe</h1>
    <div class="rRule"></div>
    <div class="rMsg"><p>The button on this page needs JavaScript. You can also write to
      post@tidel.no and we unsubscribe you.</p>
      <p lang="nb">Knappen på denne sida trenger JavaScript. Du kan også skrive til
      post@tidel.no, så melder vi deg av.</p></div>
  </noscript>
</main>

<footer>
  <div class="in">
    <div class="rad">
      <a href="/" data-t="fHjem">Home</a><a href="/support/" data-t="fHjelp">Support</a><a href="/site-privacy/" data-t="fPersonvern">Site privacy</a>
      <a href="/contact/" data-t="fKontakt">Contact</a>
    </div>
    <div class="sig">
      <span>&copy; 2026 Tidel</span><span>post@tidel.no</span>
      <span class="sp">EVERY TENTH COUNTS.</span>
    </div>
  </div>
</footer>

<script>
'use strict';
(function () {

  /* Edge-funksjonen ventelista bor i (samme adresse som basen kaller fra venteliste_kall). */
  var EDGE = 'https://ouodkduowjbkawayounh.supabase.co/functions/v1/venteliste';

  function sprak() {
    var l = (navigator.languages && navigator.languages.length ? navigator.languages[0] : navigator.language) || '';
    return /^(nb|nn|no)(-|$)/i.test(String(l)) ? 'nb' : 'en';
  }
  var TEKST = {
    nb: {
      navHjelp: 'Hjelp', navPersonvern: 'Personvern', navKontakt: 'Kontakt',
      fHjem: 'Hjem', fHjelp: 'Hjelp', fPersonvern: 'Nettstedets personvern', fKontakt: 'Kontakt',
      kick: 'Ventelista', tittel: 'Meld deg av', fane: 'Meld deg av — Tidel',
      note: 'Trykk på knappen, så sender Tidel ikke mer e-post til deg.',
      knapp: 'Meld meg av', sender: 'Melder av …', hjem: 'Gå til tidel.no',
      feil: 'Fikk ikke kontakt. Prøv igjen om litt, eller skriv til post@tidel.no.',
      avmeldt: ['Du er meldt av', 'Tidel sender ikke mer e-post til deg.'],
      ugyldig: ['Lenka gjelder ikke lenger', 'Koden i lenka finnes ikke lenger. Får du likevel e-post fra Tidel, skriv til post@tidel.no, så melder vi deg av.'],
      mangler: ['Lenka mangler koden', 'Bruk lenka nederst i e-posten fra Tidel. Den bærer koden som melder deg av.']
    },
    en: {
      navHjelp: 'Support', navPersonvern: 'Privacy', navKontakt: 'Contact',
      fHjem: 'Home', fHjelp: 'Support', fPersonvern: 'Site privacy', fKontakt: 'Contact',
      kick: 'Waiting list', tittel: 'Unsubscribe', fane: 'Unsubscribe — Tidel',
      note: 'Press the button, and Tidel sends you no more email.',
      knapp: 'Unsubscribe me', sender: 'Unsubscribing …', hjem: 'Go to tidel.no',
      feil: 'Could not get through. Try again in a moment, or write to post@tidel.no.',
      avmeldt: ['You are unsubscribed', 'Tidel sends you no more email.'],
      ugyldig: ['That link no longer works', 'The code in the link no longer exists. If you still get email from Tidel, write to post@tidel.no and we unsubscribe you.'],
      mangler: ['The link has no code', 'Use the link at the bottom of the email from Tidel. It carries the code that unsubscribes you.']
    }
  };
  var SPRAK = sprak(), T = TEKST[SPRAK];

  function $(id) { return document.getElementById(id); }
  function sett(id, tekst) { var e = $(id); if (e) e.textContent = tekst == null ? '' : String(tekst); }
  function vis(id, på) { var e = $(id); if (e) e.classList.toggle('hid', !på); }

  function oversett() {
    document.documentElement.lang = SPRAK;
    document.title = T.fane;
    var alle = document.querySelectorAll('[data-t]'), i;
    for (i = 0; i < alle.length; i++) {
      var k = alle[i].getAttribute('data-t');
      if (typeof T[k] === 'string') alle[i].textContent = T[k];
    }
  }

  function melding(par, ille) {
    sett('mTitle', par[0]);
    sett('mText', par[1]);
    var b = $('mBox'); if (b) b.classList.toggle('bad', !!ille);
    vis('aMsg', true); vis('aVis', false);
  }

  /* Koden bor etter #. Bare 64 tegn 0-9a-f slipper gjennom — alt annet er «lenka mangler koden». */
  function kodeFraAdressen() {
    var h = String(location.hash || '').replace(/^#/, '').trim();
    return /^[0-9a-f]{64}$/.test(h) ? h : '';
  }

  var KODE = kodeFraAdressen(), opptatt = false;

  function meldAv() {
    var k = $('aKnapp');
    if (opptatt || !KODE || !k) return;
    opptatt = true;
    k.disabled = true;
    sett('aKnapp', T.sender);
    sett('aStatus', '');
    /* ETT POST, uten kropp og uten egne hoder: en «enkel» forespørsel, ingen forhåndsforespørsel. */
    fetch(EDGE + '?avmeld=' + KODE, { method: 'POST' }).then(function (r) {
      return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status));
    }).then(function (j) {
      var s = j && j.status;
      if (s === 'avmeldt') melding(T.avmeldt, false);
      else melding(T.ugyldig, true);
    }).catch(function () {
      opptatt = false;
      k.disabled = false;
      sett('aKnapp', T.knapp);
      sett('aStatus', T.feil);
    });
  }

  oversett();
  if (!KODE) {
    melding(T.mangler, true);
  } else {
    vis('aVis', true); vis('aMsg', false);
    var knapp = $('aKnapp'); if (knapp) knapp.addEventListener('click', meldAv);
  }
})();
</script>
</body>
</html>
